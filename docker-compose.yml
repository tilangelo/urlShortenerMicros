services:

  postgres:
    image: postgres:16
    container_name: url-shortener-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortener-net 

  redis:
    image: redis:7
    container_name: url-shortener-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - shortener-net  

  shortener-core:
    build: ./shortener-core
    container_name: shortener-core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment: 
      SPRING_PROFILES_ACTIVE: docker
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - shortener-net  

  shortener-redirect:
    build: ./shortener_redirect
    container_name: shortener-redirect
    depends_on:
      - redis
    environment: 
      SPRING_PROFILES_ACTIVE: docker
    env_file:
      - .env
    ports:
      - "8081:8081"
    networks:
      - shortener-net  

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - shortener-core
      - shortener-redirect
      - redis
    environment: 
      SPRING_PROFILES_ACTIVE: docker
    env_file:
      - .env
    ports:
      - "8082:8082"
    networks:
      - shortener-net  

networks:
  shortener-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
